title: スタイリッシュインドアファッション＆スマイル動画プロンプト集 (全10シーン)
notes:
- お写真のような洗練されたインテリア（ソファ、ラグ、観葉植物など）を背景に、スタイリッシュなキャミソールやサテントップスを着用したモデルが美しくポージングし、途中でカメラに気づいて「ニコッ」と微笑みかける演出を網羅したプロンプト集です。
scenes:
- id: s01
  title: ピンクサテントップス＆ソファでの脚組みポーズ
  prompt: 白を基調としたモダンな部屋のソファに座る魅力的な女性の全身ショット。ピンクの華やかなサテンキャミソールと黒のミニスカートを着用し、美脚を組んだスタイリッシュなポーズ。隣にはエレガントなハンドバッグ、背景には観葉植物。自然な室内光、高精細な肌と布の質感、フォトリアル、8k。
  video: ソファの上で足を組んでスタイリッシュにポーズをとっている女性。片手で軽く髪に触れながらモデルライクな表情を見せているが、5秒目あたりでカメラに向かって目線を合わせ、親しみやすく「ニコッ」と明るく微笑む。スムーズなカメラワーク、超リアル、8秒。
  seconds: 8
- id: s02
  title: ナチュラルモダンなリビング＆オープンバックキャミ
  prompt: 明るいリビングのファブリックソファで寛ぐ女性のミディアムロングショット。華奢なストラップのサテントップスを着用し、リラックスした姿勢で座っている。柔らかな昼光、温かみのあるインテリア、4k、フォトリアル。
  video: ソファにゆったりと腰掛けている女性。最初はリラックスして周囲を見渡しているが、カメラの存在に気づくと身体を少し起こし、首を傾げながら可愛らしく優しく微笑む。8秒。
  seconds: 8
- id: s03
  title: ラグジュアリーな室内＆ビスチェ風トップス
  prompt: エレガントな室内で、ブランケットが敷かれたソファに座る女性のスタイリッシュなポートレート。サテン地のビスチェトップスとヒールサンダルを合わせたファッション誌風の構図。洗練されたライティング、8k。
  video: ソファでポーズを決めているモデル。クールな表情から一転、カメラと目が合うとフッと表情を緩め、ハニカミながらチャーミングに笑顔を見せる。8秒。
  seconds: 8
- id: s04
  title: ホワイトインテリア＆キャミソールワンピ
  prompt: 白を基調とした部屋で、スリット入りのキャミソールワンピースを着てソファに座る女性。脚線を美しく見せるアングル、自然な光のハイライト、被写界深度が浅い背景、フォトリアル。
  video: ソファに座ってドレスの裾を軽く整えている女性。ふと顔を上げてカメラを直視し、直後に優しく華やかな笑顔を浮かべる。自然なモーション、8秒。
  seconds: 8
- id: s05
  title: 日当たりの良い窓際ソファ＆パステルサテントップ
  prompt: 窓からの光が差し込む明るい部屋で、パステルカラーのサテントップスを着た女性のポートレート。ソファに座り、リラックスした表情でポーズ。輝く肌の質感、8k。
  video: 太陽光を浴びながらソファで寛ぐ女性。カメラが近づくと目線を合わせ、髪を耳にかけながら嬉しそうに「ニコッ」と微笑みかける。8秒、超リアル。
  seconds: 8
- id: s06
  title: シックな観葉植物とレザーソファ＆シルクトップス
  prompt: 観葉植物が飾られたシックな部屋のソファに座る女性のフルレングスショット。Vネックのシルクトップスとショートパンツ。洗練された大人の雰囲気、スタジオ風ライティング、4k。
  video: ソファに腰かけ、足を組み替えるエレガントな女性。ふとカメラに気づき、大人の余裕を感じさせる上品で魅力的な笑顔を見せる。8秒。
  seconds: 8
- id: s07
  title: カジュアルリッチなソファスタイル＆レースキャミ
  prompt: ベージュのニットスローが掛けられたソファに座る女性。レース付きのサテントップスを着用し、カメラに目を向ける手前のリラックスカット。自然光、高詳細。
  video: ソファでリラックスしている女性。撮影に気づくと照れくさそうに一瞬目を伏せてから、カメラに向かってパッと明るい笑顔を咲かせる。8秒。
  seconds: 8
- id: s08
  title: モダンアパートメント＆Vネックサテントップス
  prompt: 洗練されたアパートのソファで寛ぐモデル。胸元のVカットが美しいサテントップスとヒールを着用。背景にはスタイリッシュな小物と植物、フォトリアル、8k。
  video: ソファで肘をついてポーズをとっている女性。カメラが手前へ寄っていくと、視線を合わせて自信に満ちたキュートな笑顔を浮かべる。8秒。
  seconds: 8
- id: s09
  title: ミニマルルーム＆クロップドサテントップス
  prompt: シンプルで清潔感のある部屋のソファに座る女性。ピンクのクロップドサテントップスを着用。自然なライティングと柔らかな影、グラマラスで健康的なポートレート。
  video: ソファに深く腰掛けていた女性が、カメラに気づいて少し前かがみになり、親しみやすいいタズラっぽい笑顔を見せる。8秒。
  seconds: 8
- id: s10
  title: ホテルライクな室内＆サテンキャミソールスタイル
  prompt: ホテルの客室のような高級感あるインテリアのソファに座る女性。サテンキャミソールと組み替えた綺麗な脚線美。柔らかな環境光、シネマティック、8k。
  video: ソファの上で優雅に座っている女性。レンズに視線が留まると、表情がぱっと和らぎ、カメラに向かって手を振るように優しくニコッと微笑む。8秒。
  seconds: 8
