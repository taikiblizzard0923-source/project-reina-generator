title: 59. リゾート街歩き・カメラ気づき笑顔編 (10シーン)
notes:
- '* **〇〇**: 27歳の架空の日本人女性（卵形の顔、切れ長のこげ茶の瞳、豊満で豊かなバストライン、均整の取れたしなやかな成人の体形）'
- '* **衣装指定**: オリーブグリーンのフロント結びノースリーブ・クロップトップに、白のハイウエスト・ワイドフレアパンツ、ハンドバッグを持った洗練されたリゾートストリートスタイル。'
scenes:
- id: s01
  title: 石畳のリゾート街並み歩き（視線外しからカメラに気づいてパッと笑顔）
  prompt: 〇〇が明るい陽光が降り注ぐ地中海風リゾート街の石畳の上を、ハンドバッグを片手に優雅に歩いている全身ショット。オリーブグリーンのクロップトップから覗く豊かな胸元と引き締まったお腹、歩みに合わせて揺れる白いフレアパンツ。ふと遠くのカメラ（相手）の存在に気づき、パッと表情を輝かせてニコッと微笑む一瞬。
  video: 静止画の〇〇を同一人物のまま動画化。石畳を歩く姿から開始。全8秒。最初の7秒で、視線を横へ向けながら歩いていた姿勢から、ふと正面のカメラを捉えて歩みを緩め、髪をサッと手で耳にかけながら「あ！」というように嬉しそうにニコッと弾ける笑顔を見せる。最後の1秒はその笑顔のまま静止。カットなし。
  seconds: 8
- id: s02
  title: ヤシの木並木通りでの歩み（揺れる髪とウエストライン、発見笑顔）
  prompt: 〇〇がヤシの木と石造りの壁が続くプロムナードを横向きに颯爽と歩いている横姿（サイドウォーキング）。フィットしたトップスの胸のボリューム感と、引き締まったウエストのラインが美しく強調された構図。カメラの視線に気づいて顔をこちらへ向け、ハッと優しく微笑みかける。
  video: 静止画の〇〇を同一人物のまま動画化。横向きに歩く姿から開始。全8秒。最初の7秒で、風に髪をなびかせながら歩き、カメラの方へ視線を滑らせて目を合わせ、口元を柔らかく緩めてニコッと愛らしく微笑みながら一歩カメラへ向かって歩み寄る。最後の1秒はその笑顔で静止。カットなし。
  seconds: 8
- id: s03
  title: テラスカフェ沿いの通り歩き（胸元の弾みと目が合ってニッコリ）
  prompt: 〇〇が賑やかなオープンカフェが立ち並ぶリゾートの路地を、カメラに向かって正面から歩いてくるストリートスナップ風ショット。歩く振動で胸元がしなやかに弾み、白のフレアパンツが風を孕む。遠くのレンズと目が合った瞬間の、不意を突かれたような可憐な笑顔。
  video: 静止画の〇〇を同一人物のまま動画化。正面から歩いてくる姿から開始。全8秒。最初の7秒で、ゆっくりと歩み寄りながら遠くのカメラに目線を合わせ、首をちょこんと傾けてニコッと魅力的な笑みを浮かべ、そのままカメラ前まで歩いてくる。最後の1秒はその至近距離の笑顔で静止。カットなし。
  seconds: 8
- id: s04
  title: 古い石段を下りるステップ（足元から振り返り笑顔）
  prompt: 〇〇が古い石造りの階段を、ハンドバッグを揺らしながら一歩ずつ軽やかに下りてくるバックスタイル〜斜めショット。白いパンツが描く美しい脚線美とヒップライン。途中でカメラに気づき、肩越しに振り返ってニコッと眩しそうに微笑む場面。
  video: 静止画の〇〇を同一人物のまま動画化。階段を下りる姿から開始。全8秒。最初の7秒で、階段を下りきって平地に立ち、クルッとカメラ側へ全身を向け、風で乱れた前髪を手で払いながら楽しそうにニコッと笑いかける。最後の1秒はその笑顔で静止。カットなし。
  seconds: 8
- id: s05
  title: ブティックのショーウィンドウ前歩き（映り込みからのカメラ視線）
  prompt: 〇〇が高級ブティックのガラスショーウィンドウの前を歩いている。ウィンドウのガラスに〇〇の美しいシルエットとスタイルが反射して映り込み、ふとガラス越しに遠くのカメラの存在に気づき、視線を変えて直接カメラへ向けてニコッと微笑むシネマティックな1枚。
  video: 静止画の〇〇を同一人物のまま動画化。ウィンドウ脇を歩く姿から開始。全8秒。最初の7秒で、ガラスの映り込みを気にしながら歩いていたが、レンズを見つけて足を止め、身体をカメラ側へひねって胸を張り、手を軽く振りながらニコッと微笑む。最後の1秒はその手を振る姿で静止。カットなし。
  seconds: 8
- id: s06
  title: 鮮やかな南国のお花畑沿い散歩（バッグ持ち替えとハニカミ笑顔）
  prompt: 〇〇がブーゲンビリアなどの美しい南国の花々が咲き誇る白壁の小道を歩いている。鮮やかな花々とオリーブグリーンのトップスのコントラストが美しく、カメラを見つけてバッグを持ち替え、少し照れくさそうにハニカミながらニコッと笑う表情。
  video: 静止画の〇〇を同一人物のまま動画化。花咲く小道を歩く姿から開始。全8秒。最初の7秒で、手に持ったバッグをもう片方の手へ持ち替え、歩みを緩めてカメラをじっと見つめ、照れくさそうに目を細めてニコッと笑う。最後の1秒はそのハニカミ笑顔で静止。カットなし。
  seconds: 8
- id: s07
  title: 噴水広場脇の優雅なウォーキング（風となびくパンツ、振り返りスマイル）
  prompt: 〇〇が噴水の水しぶきが舞う広場の脇を優雅な足取りで歩いている。水滴と太陽光のキラキラした反射の中で、白いフレアパンツとロングヘアが風になびく。カメラからの呼びかけ（レンズ）に気づいて優雅に振り返り、ニコッと微笑むリゾート感あふれるカット。
  video: 静止画の〇〇を同一人物のまま動画化。噴水脇を歩く姿から開始。全8秒。最初の7秒で、水しぶきを感じながら心地よさそうに歩き、カメラに気づいてくるりと向き直り、両手を広げて風を感じるポーズをとりながらニコッと微笑む。最後の1秒はそのポーズで静止。カットなし。
  seconds: 8
- id: s08
  title: 陽光降り注ぐシーサイドプロムナード（眩しそうな目元からニコッ）
  prompt: 〇〇が青い海を望む海岸沿いの遊歩道を歩いている。強い夏の日差しを浴びて肌と衣装が黄金色に輝き、眩しそうに片手を額にかざしながら歩いている途中にカメラを見つけ、眩しそうな目元から一転してニコッと満面の笑みを見せる場面。
  video: 静止画の〇〇を同一人物のまま動画化。海沿いを歩く姿から開始。全8秒。最初の7秒で、額にかざした手を静かに下ろし、髪をかき上げながらカメラへ向かって一直線に歩み寄り、最高の笑顔をレンズへ向ける。最後の1秒はその歩み寄った笑顔で静止。カットなし。
  seconds: 8
- id: s09
  title: 石畳のカーブ路地からの現れ（不意打ちの発見と弾ける笑顔）
  prompt: 〇〇が石造りの建物が並ぶ曲がりくねった路地の角から、軽やかな足取りでひょっこり現れる一瞬。歩きながら遠くのカメラとバッチリ目が合い、ハッと驚いた後に弾けるような満面のニコッと笑顔を見せる、ストーリー性のある縦構図。
  video: 静止画の〇〇を同一人物のまま動画化。角から現れる姿から開始。全8秒。最初の7秒で、曲がり角から姿を現して歩き出し、カメラを見つけて足をピタッと止め、両手を胸の前に添えて楽しそうに「見つかっちゃった」というようにニコッと笑う。最後の1秒はその笑顔で静止。カットなし。
  seconds: 8
- id: s10
  title: サンセット時の港町ストリートウォーキング（夕陽の輪郭光と極上スマイル）
  prompt: 茜色の夕日に包まれた港町のストリートを〇〇が歩いている。強い逆光によって豊かなボディラインと白パンツの輪郭（リムライト）が鮮やかに描き出され、カメラに向かって歩み寄りながら見せる、ドラマチックで最高に魅力的なニコッという笑顔。
  video: 静止画の〇〇を同一人物のまま動画化。夕日の中を歩く姿から開始。全8秒。最初の7秒で、夕日を背に受けながらカメラへ向かって一歩一歩優雅に近づき、目の前で立ち止まって首筋の髪をさっとなびかせ、最高に艶やかで可愛い笑顔を向ける。最後の1秒はその微笑みで静止。カットなし。
  seconds: 8
