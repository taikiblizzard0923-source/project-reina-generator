# 人物の見た目は参照画像から取るので、既定では何も指定しない。
#
# ここに髪型や顔の特徴を書くと、参照画像と食い違ったときに
# 文章のほうが優先されて別人になることがある。
# 参照画像だけでどうしても再現されない特徴がある場合にだけ、
# details に最小限で足すこと。
name: reina

# 例: "a woman in her twenties" など。空でよい
identity: ""

# 例: - "a small mole under the left eye"
# 参照画像に写っているのに再現されない特徴だけを書く
details: []

# 写真としての質感の指定（人物の外見ではない）
#
# 「高精細」「完璧な照明」に寄せるほど AI 生成らしさが出るので、
# 素人写真・フィルム・肌の粗さの側に振ってある。
# もっとスタジオ写真らしくしたい場合はここを書き換える。
style: >-
  candid amateur photograph, snapshot aesthetic, shot on 35mm film,
  Kodak Portra 400, natural film grain, true-to-life muted colors,
  imperfect available lighting, not retouched

quality: >-
  visible skin pores and fine skin texture, uneven skin tone,
  small blemishes and freckles, flyaway hairs, natural catchlights,
  slight lens softness, realistic depth of field

# 空にすると prompts.DEFAULT_NEGATIVE が使われる
negative: ""
