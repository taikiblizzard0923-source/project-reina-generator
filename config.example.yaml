# ComfyUI サーバ設定
comfyui:
  # リモート（RunPod など）の場合はここに URL を入れる。
  # RunPod: Pod の Connect → "HTTP Service [Port 8188]" の URL
  #   url: "https://xxxxxxxxxxxx-8188.proxy.runpod.net"
  # 環境変数 REINA_COMFY_URL でも上書きできる（url より優先）
  url: null

  # url が null のときに使われるローカル接続先
  host: "127.0.0.1"
  port: 8188

  verify_tls: true
  # リバースプロキシで認証をかけている場合のみ
  auth: {}
  #  bearer: "..."           # または REINA_COMFY_TOKEN
  #  username: "..."         # または REINA_COMFY_USER
  #  password: "..."         # または REINA_COMFY_PASSWORD

  # ComfyUI の output ディレクトリから画像を直接コピーする場合に指定（未設定なら API 経由で取得）
  output_dir: null

# ComfyUI の models/ 配下に置いたファイル名をそのまま書く
# ls ComfyUI/models/diffusion_models/ などで確認して合わせること
models:
  # models/unet/ または models/diffusion_models/ に置いた GGUF
  unet_gguf: "qwen-image-2.1-Q4_K_M.gguf"
  # models/text_encoders/ : Qwen-Image 2.1 は Qwen3-VL 8B 系
  # 例: qwen3vl_8b_bf16.safetensors / qwen3vl_8b_int8_convrot.safetensors
  # 旧 Qwen-Image を使う場合は qwen_2.5_vl_7b_fp8_scaled.safetensors
  text_encoder: "qwen3vl_8b_int8_convrot.safetensors"
  # text_encoder が .gguf の場合は true（CLIPLoaderGGUF を使う）
  text_encoder_is_gguf: false
  # models/vae/
  vae: "qwen_image_2.1_vae_bf16.safetensors"
  # CLIPLoader の type 引数。ComfyUI のバージョンにより "qwen_image" など
  clip_type: "qwen_image"

# 生成デフォルト
defaults:
  width: 832
  height: 1216
  steps: 25
  cfg: 2.0        # 高いほど彩度とコントラストが上がり AI 感が出る。1.5〜3.0 で調整
  shift: 3.1
  # er_sde / beta が実機の KSampler で使えるか要確認（doctor 参照）
  sampler: "er_sde"
  scheduler: "beta"
  denoise: 1.0
  batch_size: 1
  # 参照画像モード時、参照画像をこの総ピクセル数(メガピクセル)にリサイズ
  reference_megapixels: 1.0
  # 参照画像モードの denoise（低いほど参照に忠実）
  reference_denoise: 1.0

# LoRA（任意）。顔の同一性を固めたい場合に使う
loras: []
  # - name: "reina_v1.safetensors"
  #   strength: 0.85
