<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>reina generator</title>
<style>
  :root {
    --bg: #faf9f7; --card: #fff; --fg: #1c1b19; --muted: #6b6862;
    --line: #e3e0da; --accent: #b4541f; --accent-fg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#171614; --card:#201e1b; --fg:#ece9e3; --muted:#9a958c;
            --line:#332f2a; --accent:#d9743f; --accent-fg:#171614; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:14px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:10px; font-size:16px; color:var(--fg);
          background:var(--bg); border:1px solid var(--line); border-radius:8px; font-family:inherit; }
  textarea { min-height:72px; resize:vertical; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; min-width:0; }
  button { width:100%; padding:14px; font-size:16px; font-weight:600; border:0;
           border-radius:10px; background:var(--accent); color:var(--accent-fg); }
  button:disabled { opacity:.45; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .imgs { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .imgs label { display:flex; align-items:center; gap:6px; margin:0; padding:7px 10px;
          border:1px solid var(--line); border-radius:8px; font-size:13px; color:var(--fg); }
  .imgs input { width:auto; }
  .log { white-space:pre-wrap; font:12px/1.5 ui-monospace,monospace; color:var(--muted);
         max-height:140px; overflow:auto; margin-top:10px; }
  .title { font-size:14px; font-weight:600; margin-bottom:2px; }
  .thumbs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:6px;
            max-height:280px; overflow:auto; }
  .thumbs img { width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:6px;
                border:3px solid transparent; display:block; }
  .thumbs img.sel { border-color:var(--accent); }
  .check { display:flex; align-items:center; gap:8px; color:var(--fg); }
  .check input { width:auto; }
  .acts { display:flex; gap:16px; }
  .acts a { cursor:pointer; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:10px; }
  .bar div { height:100%; width:0; background:var(--accent); transition:width .25s; }
  .shot { margin-top:12px; }
  .shot img { width:100%; border-radius:10px; display:block; }
  .shot a { display:inline-block; margin-top:6px; font-size:13px; color:var(--accent); }
  .err { color:#c0392b; font-size:13px; }
</style>
</head>
<body>

<h1>reina generator</h1>
<div class="sub">生成からダウンロードまで、この画面だけで完結します</div>

<div class="card">
  <label for="mode">作り方</label>
  <select id="mode">
    <option value="scenes">シーン定義から（scenes:）</option>
    <option value="mix">軸の組み合わせから（axes:）</option>
  </select>

  <div id="scenesBox">
    <label for="scenes">シーン定義</label>
    <select id="scenes"></select>
  </div>

  <div id="mixBox" style="display:none">
    <label for="axes">軸定義</label>
    <select id="axes"></select>
    <label for="limit">組み合わせ数</label>
    <input id="limit" type="number" value="8" inputmode="numeric">
  </div>

  <label for="prompt">またはシーンを直接入力（入力すると上の指定より優先。英語で、服も具体的に書くと確実に効きます）</label>
  <textarea id="prompt" placeholder="walking along a crowded poolside, wearing a black bikini, sunny afternoon"></textarea>

  <label>人物の参照画像（顔の写真だけを選ぶ。全身写真を選ぶとその服が移ります）</label>
  <div class="imgs" id="refs"></div>

  <label>写り込ませたいもの（部屋・ペットなど）</label>
  <div class="imgs" id="scenerefs"></div>

  <div class="row">
    <div><label for="steps">ステップ</label><input id="steps" type="number" value="16" inputmode="numeric"></div>
    <div><label for="cfg">cfg</label><input id="cfg" type="number" step="0.1" value="2.0" inputmode="decimal"></div>
  </div>
  <div class="row">
    <div><label for="width">幅</label><input id="width" type="number" value="832" inputmode="numeric"></div>
    <div><label for="height">高さ</label><input id="height" type="number" value="1216" inputmode="numeric"></div>
    <div><label for="repeat">枚数</label><input id="repeat" type="number" value="1" inputmode="numeric"></div>
  </div>

  <div class="bar"><div id="bar"></div></div>
  <div id="log" class="log"></div>
</div>

<button id="go">生成する</button>
<div style="height:10px"></div>
<button id="dl" class="ghost" disabled>ZIP をダウンロード</button>

<div id="out"></div>

<div class="card" id="editCard" style="margin-top:18px">
  <div class="title">画像を編集</div>
  <div class="sub" style="margin:0 0 4px">
    生成した画像に修正の指示を出して直します。指示は具体的な英語が通りやすいです。
    直した画像にも続けて修正を重ねられます。
  </div>

  <label>編集する画像（生成結果の「この画像を編集」か、ここから選ぶ）</label>
  <div class="thumbs" id="recent"></div>
  <div style="height:8px"></div>
  <button id="reload" class="ghost">最近の画像を読み込み直す</button>

  <div class="shot" id="editPick" style="display:none"><img id="editImg" alt=""></div>

  <label for="instr">修正の指示</label>
  <textarea id="instr" placeholder="Change the white T-shirt to a navy blue T-shirt."></textarea>
  <label class="check"><input type="checkbox" id="raw">指示文だけを送る（「それ以外は変えない」を付けない）</label>

  <div class="row">
    <div><label for="erepeat">枚数</label><input id="erepeat" type="number" value="1" inputmode="numeric"></div>
    <div><label for="eseed">シード（空欄でランダム）</label><input id="eseed" type="number" inputmode="numeric"></div>
  </div>

  <div class="bar"><div id="ebar"></div></div>
  <div id="elog" class="log"></div>
  <div style="height:10px"></div>
  <button id="editgo">編集する</button>
  <div id="eout"></div>
</div>

<div class="card" style="margin-top:18px">
  <div style="font-size:14px;font-weight:600;margin-bottom:2px">画像の追加 / Pod 移行</div>
  <div class="sub" style="margin:0 0 10px">
    参照画像をここから追加できます。Pod を作り直したときは、
    先に取っておいたバックアップ（.tgz）をここに入れると設定ごと戻ります。
  </div>

  <label for="up">画像 または バックアップ(.tgz) を選ぶ</label>
  <input id="up" type="file" multiple accept="image/*,.tgz,.gz,.tar">
  <div style="height:10px"></div>
  <button id="upbtn" class="ghost">アップロード</button>

  <div style="height:14px"></div>
  <button id="bkbtn" class="ghost">設定と参照画像をバックアップ</button>
  <div class="sub" id="upmsg" style="margin-top:8px"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let runId = null;

function checkboxes(target, images) {
  target.innerHTML = images.length
    ? images.map((p) => `<label><input type="checkbox" value="${p}">${p.replace('input/','')}</label>`).join('')
    : '<span class="sub">input/ に画像がありません</span>';
}

function picked(target) {
  return [...target.querySelectorAll('input:checked')].map((el) => el.value);
}

function fill(select, names, empty) {
  select.innerHTML = names.length
    ? names.map((p) => `<option value="${p}">${p}</option>`).join('')
    : `<option value="">${empty}</option>`;
}

async function load() {
  const r = await fetch('reina/options').then((r) => r.json());
  fill($('scenes'), r.presets, 'scenes: を持つファイルがありません');
  fill($('axes'), r.axes, 'axes: を持つファイルがありません');
  checkboxes($('refs'), r.images);
  checkboxes($('scenerefs'), r.images);
}

$('mode').onchange = () => {
  const mix = $('mode').value === 'mix';
  $('scenesBox').style.display = mix ? 'none' : '';
  $('mixBox').style.display = mix ? '' : 'none';
};

const fileUrl = (p, download) =>
  'reina/file?' + (download ? 'download=1&' : '') + 'path=' + encodeURIComponent(p);

function shot(p) {
  const div = document.createElement('div');
  div.className = 'shot';
  div.innerHTML =
    `<img src="${fileUrl(p)}" alt="">` +
    `<div class="acts"><a href="${fileUrl(p, true)}" download>この1枚を保存</a>` +
    `<a data-edit>この画像を編集</a></div>`;
  div.querySelector('[data-edit]').onclick = () => {
    pickForEdit(p);
    $('editCard').scrollIntoView({behavior: 'smooth'});
  };
  return div;
}

// 1回の実行の進捗を ui（bar / log / out / btn）に反映し続ける
function watch(id, ui) {
  const timer = setInterval(async () => {
    const s = await fetch('reina/status?id=' + id).then((r) => r.json());
    if (s.error) return;

    const done = s.total ? (s.current - 1 + (s.steps ? s.step / s.steps : 0)) / s.total : 0;
    ui.bar.style.width = Math.max(0, Math.min(100, done * 100)) + '%';
    ui.log.textContent =
      (s.total ? `${s.current}/${s.total} 枚目  ` : '') +
      (s.steps ? `${s.step}/${s.steps} ステップ  ` : '') +
      `${s.elapsed}s\n` + s.log.split('\n').slice(-6).join('\n');

    const shown = ui.out.childElementCount;
    s.images.slice(shown).forEach((p) => ui.out.appendChild(shot(p)));

    if (s.finished) {
      clearInterval(timer);
      ui.btn.disabled = false;
      ui.btn.textContent = ui.idle;
      ui.bar.style.width = '100%';
      if (s.returncode !== 0) {
        ui.log.innerHTML += `<div class="err">失敗しました（終了コード ${s.returncode}）</div>`;
      }
      if (ui.onDone) ui.onDone(s);
    }
  }, 1000);
}

// -- 編集 --
let editPath = null;

function pickForEdit(p) {
  editPath = p;
  $('editImg').src = fileUrl(p);
  $('editPick').style.display = '';
  $('recent').querySelectorAll('img').forEach((img) => {
    img.classList.toggle('sel', img.dataset.path === p);
  });
}

async function loadRecent() {
  const r = await fetch('reina/recent?limit=16').then((r) => r.json());
  $('recent').innerHTML = '';
  if (!r.images.length) {
    $('recent').innerHTML = '<span class="sub">まだ生成した画像がありません</span>';
    return;
  }
  r.images.forEach((p) => {
    const img = document.createElement('img');
    img.src = fileUrl(p);
    img.loading = 'lazy';
    img.alt = '';
    img.dataset.path = p;
    img.classList.toggle('sel', p === editPath);
    img.onclick = () => pickForEdit(p);
    $('recent').appendChild(img);
  });
}

$('reload').onclick = loadRecent;

$('editgo').onclick = async () => {
  const instruction = $('instr').value.trim();
  if (!editPath) { alert('編集する画像を選んでください'); return; }
  if (!instruction) { alert('修正の指示を入力してください'); return; }

  $('editgo').disabled = true;
  $('editgo').textContent = '編集中…';
  $('eout').innerHTML = '';
  $('ebar').style.width = '0';

  const r = await fetch('reina/run', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      mode: 'edit', image: editPath, instruction,
      raw: $('raw').checked, repeat: $('erepeat').value, seed: $('eseed').value,
    }),
  }).then((r) => r.json());

  if (r.error) {
    $('editgo').disabled = false;
    $('editgo').textContent = '編集する';
    $('elog').innerHTML = `<div class="err">${r.error}</div>`;
    return;
  }
  watch(r.id, {
    bar: $('ebar'), log: $('elog'), out: $('eout'), btn: $('editgo'), idle: '編集する',
    onDone: loadRecent,
  });
};

// -- 生成 --
$('go').onclick = async () => {
  $('go').disabled = true;
  $('go').textContent = '生成中…';
  $('dl').disabled = true;
  $('out').innerHTML = '';
  $('bar').style.width = '0';

  const body = {
    mode: $('mode').value,
    prompt: $('prompt').value.trim() || null,
    scenes: $('scenes').value || null,
    axes: $('axes').value || null,
    limit: $('limit').value,
    ref: picked($('refs')),
    scene_ref: picked($('scenerefs')),
    steps: $('steps').value, cfg: $('cfg').value,
    width: $('width').value, height: $('height').value,
    repeat: $('repeat').value,
  };
  const r = await fetch('reina/run', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
  }).then((r) => r.json());

  runId = r.id;
  watch(runId, {
    bar: $('bar'), log: $('log'), out: $('out'), btn: $('go'), idle: '生成する',
    onDone: (s) => {
      if (s.returncode === 0 && s.images.length) $('dl').disabled = false;
      loadRecent();
    },
  });
};

$('upbtn').onclick = async () => {
  const files = $('up').files;
  if (!files.length) { alert('ファイルを選んでください'); return; }
  $('upbtn').disabled = true; $('upbtn').textContent = '送信中…';

  const form = new FormData();
  for (const f of files) form.append('file', f, f.name);
  const r = await fetch('reina/upload', {method: 'POST', body: form}).then((r) => r.json());

  $('upbtn').disabled = false; $('upbtn').textContent = 'アップロード';
  const msg = [];
  if (r.saved?.length) msg.push('追加: ' + r.saved.join(', '));
  if (r.restored?.length) msg.push('復元: ' + r.restored.join(' / '));
  if (r.errors?.length) msg.push('エラー: ' + r.errors.join(' / '));
  $('upmsg').textContent = msg.join('\n') || '変更はありません';
  load();
};

$('bkbtn').onclick = async () => {
  $('bkbtn').disabled = true; $('bkbtn').textContent = '作成中…';
  const b = await fetch('reina/backup').then((r) => r.json());
  $('bkbtn').disabled = false; $('bkbtn').textContent = '設定と参照画像をバックアップ';
  if (b.error) { $('upmsg').textContent = b.error; return; }
  $('upmsg').textContent = `${(b.size / 1e6).toFixed(1)}MB — ダウンロードが始まります`;
  location.href = 'reina/file?download=1&path=' + encodeURIComponent(b.path);
};

$('dl').onclick = async () => {
  $('dl').textContent = '準備中…';
  const z = await fetch('reina/zip?id=' + runId).then((r) => r.json());
  $('dl').textContent = 'ZIP をダウンロード';
  if (z.error) { alert(z.error); return; }
  location.href = 'reina/file?download=1&path=' + encodeURIComponent(z.path);
};

load();
loadRecent();
</script>
</body>
</html>
