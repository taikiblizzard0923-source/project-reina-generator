<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>reina clip</title>
<style>
  :root {
    --bg: #faf9f7; --card: #fff; --fg: #1c1b19; --muted: #6b6862;
    --line: #e3e0da; --accent: #b4541f; --accent-fg: #fff; --chip: #f1eee9; --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#171614; --card:#201e1b; --fg:#ece9e3; --muted:#9a958c;
            --line:#332f2a; --accent:#d9743f; --accent-fg:#171614; --chip:#2a2723; --err:#ff7b6b; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; }
  .wrap { max-width:720px; margin:0 auto;
          padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                   calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  a { color:var(--accent); }
  h1 { font-size:18px; margin:0; }
  .top { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .top a { font-size:13px; }

  /* 実行中だけ上に貼り付く: 何をしていて、どこまで進んだか、止めるボタン */
  .run { position:sticky; top:0; z-index:5; display:none; margin:0 -16px 12px; padding:10px 16px;
         background:var(--bg); border-bottom:1px solid var(--line); }
  .run.show { display:block; }
  .run .head { display:flex; align-items:center; gap:10px; }
  .run .text { flex:1; min-width:0; font-size:14px; font-weight:600; }
  .run .text small { display:block; font-weight:400; color:var(--muted); font-size:12px;
                     white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .run button { flex:none; width:auto; margin:0; padding:8px 14px; font-size:14px; background:transparent;
                color:var(--accent); border:1px solid var(--accent); }
  .bar { height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:8px; }
  .bar div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  .msg { font-size:13px; color:var(--muted); min-height:20px; margin:-4px 0 10px; white-space:pre-wrap; }
  .msg.err, .err { color:var(--err); }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  h2 { font-size:15px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input, select, textarea { width:100%; padding:12px; font-size:16px; color:var(--fg);
          background:var(--bg); border:1px solid var(--line); border-radius:10px; font-family:inherit; }
  input, textarea { -webkit-appearance:none; appearance:none; }
  textarea { min-height:84px; resize:vertical; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; min-width:0; }

  button { width:100%; padding:14px; margin-top:12px; font-size:16px; font-weight:600; border:0; border-radius:12px;
           background:var(--accent); color:var(--accent-fg); font-family:inherit; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .btns { display:flex; gap:8px; }
  .btns button:first-child { flex:2; }
  .btns button { flex:1; }

  .chips { display:flex; gap:6px; overflow-x:auto; padding:6px 0 2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chips button, .refs label { flex:none; width:auto; margin:0; font-size:13px; font-weight:400; padding:7px 12px;
          border-radius:999px; border:1px solid var(--line); background:var(--chip); color:var(--fg); }
  .refs { display:flex; flex-wrap:wrap; gap:6px; }
  .refs label { display:flex; align-items:center; gap:6px; }
  .refs input { width:auto; margin:0; -webkit-appearance:checkbox; appearance:auto; }

  details { margin-top:12px; }
  summary { font-size:13px; color:var(--accent); cursor:pointer; padding:4px 0; }
  .plist { max-height:44vh; overflow:auto; margin-top:8px; }
  .plist button { display:block; text-align:left; margin:0 0 6px; padding:10px 12px; background:var(--chip);
                  color:var(--fg); border:1px solid var(--line); font-size:13px; line-height:1.45; font-weight:400; }
  .plist button b { display:block; font-size:12px; color:var(--accent); }
  .plist button.sel { border-color:var(--accent); }

  .still img { width:100%; max-height:64vh; object-fit:contain; border-radius:12px; display:block;
               background:var(--chip); margin-top:8px; }
  .empty { display:flex; align-items:center; justify-content:center; height:160px; border-radius:12px;
           background:var(--chip); color:var(--muted); font-size:13px; margin-top:8px; text-align:center; padding:12px; }
  .strip { display:flex; gap:6px; overflow-x:auto; margin-top:8px; padding-bottom:2px; scrollbar-width:none; }
  .strip::-webkit-scrollbar { display:none; }
  .strip img { flex:none; width:60px; height:90px; object-fit:cover; border-radius:8px; cursor:pointer;
               border:3px solid transparent; }
  .strip img.sel { border-color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(76px, 1fr)); gap:6px; margin-top:8px;
          max-height:46vh; overflow:auto; }
  .grid img { width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:8px; cursor:pointer; }
  .acts { display:flex; gap:18px; font-size:14px; margin-top:8px; }
  video { width:100%; max-height:70vh; border-radius:12px; display:block; background:#000; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <h1>静止画 → 動画</h1>
  <a href="../reina">静止画だけの画面</a>
</div>

<div class="run" id="run">
  <div class="head">
    <div class="text"><span id="runTitle">実行中</span><small id="runLog"></small></div>
    <button id="cancel">キャンセル</button>
  </div>
  <div class="bar"><div id="runBar"></div></div>
</div>
<div class="msg" id="msg"></div>

<!-- ① -->
<div class="card">
  <h2>① 0秒目の静止画を作る</h2>
  <label for="scene">場面（英語。服装・場所・光を具体的に）</label>
  <textarea id="scene" enterkeyhint="done"
    placeholder="sitting at a cafe terrace by the window, white blouse, soft afternoon light"></textarea>
  <div class="chips" data-for="scene">
    <button>cafe terrace, white blouse, soft afternoon light</button>
    <button>beach at sunset, white sundress, golden light</button>
    <button>quiet street in autumn, beige trench coat, overcast</button>
    <button>cozy living room, oversized knit sweater, warm lamp light</button>
    <button>park in spring, light cardigan and jeans, cherry blossoms</button>
  </div>
  <details id="presetBox">
    <summary>プリセットから呼び出す</summary>
    <select id="preset" style="margin-top:6px"><option value="">選んでください</option></select>
    <div class="plist" id="plist"></div>
  </details>
  <label>人物の参照画像（顔の写真だけ）</label>
  <div class="refs" id="refs"></div>
  <details>
    <summary>シード</summary>
    <input id="seed" type="number" inputmode="numeric" placeholder="空欄でランダム（同じ値なら同じ構図）" style="margin-top:6px">
  </details>
  <div class="btns">
    <button id="goStill">静止画を作る</button>
    <button id="again" class="ghost" title="同じ場面・別のシード">別の構図</button>
  </div>
</div>

<!-- ② -->
<div class="card" id="c2">
  <h2>② 0秒目を確認・修正</h2>
  <div class="sub">下の候補をタップすると切り替わります（直す前に戻すときも）。</div>
  <div class="still" id="stillBox"><div class="empty">① で静止画を作るか、<br>「最近の画像から選ぶ」で既存の画像を選んでください</div></div>
  <div class="strip" id="strip"></div>
  <div class="acts"><a id="stillDl" download style="display:none">この画像を保存</a></div>
  <details id="recentBox">
    <summary>最近の画像から選ぶ</summary>
    <div class="grid" id="recent"></div>
  </details>
  <label for="instr">直す指示（必要なときだけ。具体的な英語が通りやすい）</label>
  <textarea id="instr" enterkeyhint="done" placeholder="Change the white blouse to a light blue linen shirt."></textarea>
  <div class="chips" data-for="instr">
    <button>Make her smile naturally.</button>
    <button>Change the background to a bright cafe interior.</button>
    <button>Make the lighting warmer, like late afternoon sun.</button>
    <button>Change the top to a navy blue knit sweater.</button>
  </div>
  <button id="goEdit" class="ghost">この画像を直す</button>
</div>

<!-- ③ -->
<div class="card" id="c3">
  <h2>③ 動画にする</h2>
  <label for="action">動き・カメラ（英語）</label>
  <textarea id="action" enterkeyhint="done" placeholder="she sips her coffee, looks at the camera and smiles"></textarea>
  <div class="sub">ここは見た目の動きだけ。話す言葉は下の「セリフ」に書きます（混ざらないように別々に渡します）。</div>
  <div class="chips" data-for="action">
    <button>she looks at the camera and smiles</button>
    <button>she waves at the camera</button>
    <button>she brushes her hair back and laughs</button>
    <button>she turns toward the camera, slow push-in</button>
    <button>she walks toward the camera</button>
  </div>
  <label for="say">セリフ（空欄なら話さない）</label>
  <input id="say" enterkeyhint="done" placeholder="ここ、すごく落ち着くね。">
  <div class="row">
    <div><label for="seconds">長さ</label>
      <select id="seconds"><option value="3">3秒</option><option value="5">5秒</option>
        <option value="8">8秒</option><option value="10">10秒</option><option value="15">15秒</option></select></div>
    <div><label for="lang">セリフの言語</label>
      <select id="lang"><option>Japanese</option><option>English</option><option>Korean</option><option>Chinese</option></select></div>
  </div>
  <details>
    <summary>声・音・シード</summary>
    <label for="voice">声の特徴（英語）</label>
    <input id="voice" value="a calm, relaxed, slightly low adult female voice">
    <label for="sound">環境音（英語。空欄なら場面に合わせる）</label>
    <input id="sound" placeholder="quiet cafe ambience, cups clinking">
    <label for="music">BGM（英語。空欄なら無し）</label>
    <input id="music">
    <label for="vseed">シード（空欄でランダム）</label>
    <input id="vseed" type="number" inputmode="numeric">
  </details>
  <button id="goVideo">動画を作る</button>
  <div id="vout"></div>
</div>

</div>
<script>
const $ = (id) => document.getElementById(id);
// /reina/clip → /reina（ComfyUI がサブパスで配信されていても動くように）
const API = location.pathname.replace(/\/clip\/?$/, '');
const fileUrl = (p, dl) => `${API}/file?${dl ? 'download=1&' : ''}path=${encodeURIComponent(p)}`;
const DEFAULT_REFS = ['input/face.png', 'input/rightside.png', 'input/leftside.png'];
const KEEP = ['scene', 'seed', 'instr', 'action', 'say', 'voice', 'sound', 'music', 'seconds', 'lang', 'vseed'];
const KIND = {still: '静止画', edit: '修正', video: '動画'};
const BUTTONS = ['goStill', 'again', 'goEdit', 'goVideo'];

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('clip.' + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('clip.' + k, JSON.stringify(v)); } catch {} },
};
// CLI の進捗は \r で同じ行を書き換えるので、各行の最後の書き換えだけを残す
const logLines = (text) =>
  text.split('\n').map((l) => l.split('\r').filter((x) => x.trim()).pop() || '').filter((l) => l.trim());

let still = null;
let busy = false;
let cancelled = false;
const history = [];

function say(text, error = false) {
  $('msg').textContent = text;
  $('msg').classList.toggle('err', error);
}

// 失敗の理由を隠さないための fetch（ステータスと本文の先頭を例外にする）
async function api(path, init) {
  const url = `${API}/${path}`;
  let res;
  try { res = await fetch(url, {cache: 'no-store', ...init}); }
  catch (e) { throw new Error(`${url} に接続できません（${e.message}）`); }
  const text = await res.text();
  try { return JSON.parse(text); }
  catch { throw new Error(`${url} → ${res.status} ${text.replace(/<[^>]+>/g, ' ').trim().slice(0, 120)}`); }
}

// -- 入力 ------------------------------------------------------------------
document.querySelectorAll('.chips').forEach((box) => {
  box.querySelectorAll('button').forEach((b) => {
    b.onclick = () => {
      const target = $(box.dataset.for);
      target.value = b.textContent;
      target.dispatchEvent(new Event('input'));
    };
  });
});

function restore() {
  KEEP.forEach((id) => {
    const v = store.get(id);
    if (v !== null && v !== undefined) $(id).value = v;
    $(id).addEventListener('input', () => store.set(id, $(id).value));
    $(id).addEventListener('change', () => store.set(id, $(id).value));
  });
  (store.get('history') || []).forEach((p) => history.push(p));
  if (history.length) setStill(store.get('still') || history[history.length - 1]);
  else lockLater(true);
  const v = store.get('video');
  if (v) showVideo(v, false);
}

async function loadOptions() {
  let r;
  try { r = await api('options'); }
  catch (e) {
    $('refs').innerHTML = `<span class="err">画像の一覧を読み込めません: ${e.message}</span> <a href="#" id="retry">再読み込み</a>`;
    $('retry').onclick = (ev) => { ev.preventDefault(); loadOptions(); };
    return;
  }
  fillPresets(r.presets || []);
  const chosen = store.get('refs') || DEFAULT_REFS;
  $('refs').innerHTML = r.images.length
    ? r.images.map((p) =>
        `<label><input type="checkbox" value="${p}" ${chosen.includes(p) ? 'checked' : ''}>${p.replace('input/', '')}</label>`
      ).join('')
    : '<span class="sub">input/ に画像がありません</span>';
  $('refs').onchange = () => store.set('refs', refs());
}
const refs = () => [...$('refs').querySelectorAll('input:checked')].map((el) => el.value);


// プリセット（presets/*.yaml の scenes:）。width/height があれば、場面を書き換えない限りそれも使う
let presetSize = store.get('presetSize');
function fillPresets(names) {
  const last = store.get('preset') || '';
  $('preset').innerHTML = '<option value="">選んでください</option>' +
    names.map((n) => `<option ${n === last ? 'selected' : ''}>${n}</option>`).join('');
  if (last && names.includes(last)) loadPreset(last);
}
async function loadPreset(name) {
  store.set('preset', name);
  $('plist').innerHTML = '';
  if (!name) return;
  let r;
  try { r = await api(`scenes?name=${encodeURIComponent(name)}`); }
  catch (e) { $('plist').innerHTML = `<span class="err">${e.message}</span>`; return; }
  if (r.error || !r.scenes.length) {
    $('plist').innerHTML = `<span class="sub">${r.error || 'scenes: が空です'}</span>`;
    return;
  }
  r.scenes.forEach((s) => {
    const b = document.createElement('button');
    b.innerHTML = '<b></b><span></span>';
    b.querySelector('b').textContent = [s.id, s.title, s.width && s.height ? `${s.width}×${s.height}` : '',
      s.video ? '動画の指示あり' : ''].filter(Boolean).join('  ');
    b.querySelector('span').textContent = s.prompt;
    b.className = $('scene').value.trim() === s.prompt ? 'sel' : '';
    b.onclick = () => {
      $('scene').value = s.prompt;
      store.set('scene', s.prompt);
      presetSize = s.width && s.height ? {width: s.width, height: s.height, prompt: s.prompt} : null;
      store.set('presetSize', presetSize);
      // 動画の指示も持っているプリセットなら、③の欄と長さも埋める
      // 動き（見た目）とセリフは指示文の中で別の行に分けて渡すので、元の日本語のまま使う
      const motion = s.video || s.video_en;
      if (motion) { $('action').value = motion; store.set('action', motion); }
      if (s.seconds) {
        const options = [...$('seconds').options].map((o) => +o.value);
        const near = options.reduce((a, b) => (Math.abs(b - s.seconds) < Math.abs(a - s.seconds) ? b : a));
        $('seconds').value = String(near); store.set('seconds', String(near));
      }
      $('plist').querySelectorAll('button').forEach((x) => x.classList.toggle('sel', x === b));
    };
    $('plist').appendChild(b);
  });
}
$('preset').onchange = () => loadPreset($('preset').value);

// -- 0秒目 -----------------------------------------------------------------
function lockLater(on) {
  $('goEdit').disabled = on || busy;
  $('goVideo').disabled = on || busy;
}

function setStill(p) {
  still = p;
  if (!history.includes(p)) history.push(p);
  store.set('still', p);
  store.set('history', history.slice(-20));
  $('stillBox').innerHTML = `<img src="${fileUrl(p)}" alt="">`;
  $('stillDl').href = fileUrl(p, true);
  $('stillDl').style.display = '';
  $('strip').innerHTML = '';
  history.slice(-20).reverse().forEach((h) => {
    const img = document.createElement('img');
    img.src = fileUrl(h);
    img.loading = 'lazy';
    img.className = h === p ? 'sel' : '';
    img.onclick = () => setStill(h);
    $('strip').appendChild(img);
  });
  lockLater(false);
}

async function loadRecent() {
  let r;
  try { r = await api('recent?limit=30'); }
  catch (e) { $('recent').innerHTML = `<span class="err">${e.message}</span>`; return; }
  $('recent').innerHTML = r.images.length ? '' : '<span class="sub">まだ画像がありません</span>';
  r.images.forEach((p) => {
    const img = document.createElement('img');
    img.src = fileUrl(p);
    img.loading = 'lazy';
    img.onclick = () => { setStill(p); $('recentBox').open = false; $('c2').scrollIntoView({behavior: 'smooth'}); };
    $('recent').appendChild(img);
  });
}
$('recentBox').addEventListener('toggle', () => { if ($('recentBox').open) loadRecent(); });

function showVideo(p, scroll = true) {
  store.set('video', p);
  $('vout').innerHTML =
    `<video src="${fileUrl(p)}" controls playsinline preload="metadata"></video>` +
    `<div class="acts"><a href="${fileUrl(p, true)}" download>動画を保存</a></div>`;
  if (scroll) $('vout').scrollIntoView({behavior: 'smooth', block: 'center'});
}

// -- 実行 ------------------------------------------------------------------
let wakeLock = null;
async function keepAwake(on) {
  // 生成中に画面が消えると iOS はページを止めるので、できるだけ点けておく
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}

function setBusy(kind) {
  busy = Boolean(kind);
  BUTTONS.forEach((id) => { $(id).disabled = busy; });
  if (!busy) lockLater(!still);
  $('run').classList.toggle('show', busy);
  if (busy) {
    $('runTitle').textContent = `${KIND[kind]}を作成中`;
    $('runLog').textContent = '準備中';
    $('runBar').style.width = '3%';
    say('');
  }
  keepAwake(busy);
}

$('cancel').onclick = async () => {
  if (!confirm('実行中の処理を止めますか？')) return;
  const running = store.get('running');
  try { await api(`cancel?id=${running ? running.id : ''}`, {method: 'POST'}); } catch {}
  // 記録が残っていない（ComfyUI 再起動後など）ときも、画面はここで戻す
  cancelled = true;
  store.set('running', null);
  setBusy(null);
  say('キャンセルしました');
};

// 1回の実行を見届けて、最後に保存されたファイルを返す。
// ページを閉じても戻ってきたら続きを追えるよう、実行 ID を保存しておく
function watch(id, kind) {
  setBusy(kind);
  cancelled = false;
  let failures = 0;
  return new Promise((resolve) => {
    const tick = async () => {
      if (cancelled) return resolve(null);
      let s;
      try { s = await api(`status?id=${id}`); failures = 0; }
      catch (e) {
        failures += 1;
        $('runLog').textContent = `進み具合を取得できません（${failures}回目）`;
        if (failures < 15) return setTimeout(tick, 2000);
        store.set('running', null); setBusy(null); say(e.message, true); return resolve(null);
      }
      if (s.error) {
        store.set('running', null); setBusy(null);
        say('実行の記録が見つかりません（ComfyUI を再起動した場合など）', true);
        return resolve(null);
      }
      const lines = logLines(s.log);
      $('runBar').style.width = (s.steps ? Math.max(3, (s.step / s.steps) * 100) : 3) + '%';
      $('runTitle').textContent =
        `${KIND[kind]}を作成中 · ` + (s.steps ? `${s.step}/${s.steps} ステップ · ` : '') + `${Math.round(s.elapsed)}秒`;
      $('runLog').textContent = lines.slice(-1)[0] || '準備中';
      if (!s.finished) return setTimeout(tick, 1000);

      store.set('running', null);
      setBusy(null);
      if (s.returncode !== 0 || !s.images.length) {
        say(`${KIND[kind]}に失敗しました（終了コード ${s.returncode}）\n` + lines.slice(-3).join('\n'), true);
        return resolve(null);
      }
      say(`${KIND[kind]}ができました（${Math.round(s.elapsed)}秒）`);
      try { navigator.vibrate && navigator.vibrate(200); } catch {}
      document.title = '✓ reina clip';
      setTimeout(() => { document.title = 'reina clip'; }, 8000);
      resolve(s.images[s.images.length - 1]);
    };
    tick();
  });
}

async function start(kind, body) {
  if (busy) return;
  document.activeElement && document.activeElement.blur();
  setBusy(kind);
  const r = await api('run', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
  }).catch((e) => ({error: e.message}));
  if (r.error) { setBusy(null); say(r.error, true); return; }
  store.set('running', {id: r.id, kind});
  finish(kind, await watch(r.id, kind));
}

function finish(kind, path) {
  if (!path) return;
  if (kind === 'video') return showVideo(path);
  setStill(path);
  $('c2').scrollIntoView({behavior: 'smooth'});
}

function makeStill(newSeed) {
  const prompt = $('scene').value.trim();
  if (!prompt) { $('scene').focus(); return say('場面を入力してください', true); }
  if (!refs().length && !confirm('参照画像なしで作りますか？（別人になります）')) return;
  if (newSeed) { $('seed').value = ''; store.set('seed', ''); }
  const size = presetSize && presetSize.prompt === prompt ? {width: presetSize.width, height: presetSize.height} : {};
  start('still', {prompt, ref: refs(), seed: $('seed').value, repeat: 1, ...size});
}
$('goStill').onclick = () => makeStill(false);
$('again').onclick = () => makeStill(true);

$('goEdit').onclick = () => {
  const instruction = $('instr').value.trim();
  if (!instruction) { $('instr').focus(); return say('直す指示を入力してください', true); }
  start('edit', {mode: 'edit', image: still, instruction, repeat: 1});
};

$('goVideo').onclick = () => {
  const action = $('action').value.trim();
  if (!action) { $('action').focus(); return say('動きを入力してください', true); }
  $('vout').innerHTML = '';
  start('video', {
    mode: 'video', image: still, action,
    say: $('say').value, voice: $('voice').value, sound: $('sound').value, music: $('music').value,
    seconds: $('seconds').value, lang: $('lang').value, seed: $('vseed').value,
  });
};

restore();
loadOptions();
// 生成中にページが閉じられていたら、続きを追う
const running = store.get('running');
if (running) watch(running.id, running.kind).then((p) => finish(running.kind, p));
document.addEventListener('visibilitychange', () => { if (!document.hidden && busy) keepAwake(true); });
</script>
</body>
</html>
